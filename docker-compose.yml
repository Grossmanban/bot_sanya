services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  # HTTPS for the Mini App: Caddy gets a Let's Encrypt certificate for $DOMAIN automatically
  caddy:
    image: caddy:2.8
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
